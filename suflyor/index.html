<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Суфлёр вводного урока</title>
<style>
:root{--bg:#F2F4F8;--surface:#fff;--ink:#141B2D;--muted:#5A6478;--line:#D9DFE9;--accent:#2B59E0;--err:#C23A3A}
@media (prefers-color-scheme:dark){:root{--bg:#0E1320;--surface:#161D2E;--ink:#E7EBF3;--muted:#9AA4B8;--line:#2A3449;--accent:#7C9BFF;--err:#F07A7A;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;margin:0}p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 11px;font:inherit}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--err);font-size:14px}
</style></head><body>

function d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function unlock(pass){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(DATA.iv)},key,d(DATA.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}

});
